<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050505" />
    <title>Kalvix Nexus</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="intro" class="intro" aria-label="Kalvix Nexus launch video">
        <video
          id="launchVideo"
          class="launch-video"
          autoplay
          playsinline
          preload="auto"
        >
          <source src="./launching-video.mp4" type="video/mp4" />
        </video>
      </section>

      <section id="home" class="home" aria-label="Kalvix Nexus app home">
        <div class="brand">
          <img src="./logo.png" alt="Kalvix Nexus logo" />
          <p>KALVIX NEXUS</p>
          <h1>POS System</h1>
        </div>

        <nav class="actions" aria-label="Account actions">
          <a class="primary" href="https://knos-89c01.web.app/signup">Sign Up</a>
          <a href="https://knos-89c01.web.app/login">Sign In</a>
          <a class="admin" href="https://knos-89c01.web.app/admin-login">Admin</a>
        </nav>

        <p class="version">V1.0 Secure Cloud POS</p>
      </section>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
